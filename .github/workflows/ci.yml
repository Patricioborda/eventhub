name: CI - Build and Test

on:
  pull_request:
    branches: [main]
  release:
    types: [published, created, edited]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar que el proyecto se ejecuta
        run: |
          python manage.py check

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Crear archivo .env para testing
        run: |
          cat > .env << EOF
          SECRET_KEY=test-secret-key-for-github-actions
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1
          DATABASE_NAME=test_db.sqlite3
          EOF

      - name: Ejecutar migraciones
        run: |
          python manage.py migrate

      - name: Ejecutar tests unitarios con coverage
        run: |
          mkdir -p static
          coverage run --source='.' manage.py test app.test.test_unit --verbosity=2
          coverage report --show-missing

  integration-test:
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear archivo .env para integration testing
        run: |
          cat > .env << EOF
          SECRET_KEY=integration-test-secret-key
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1
          DATABASE_NAME=integration_test_db.sqlite3
          EOF

      - name: Ejecutar migraciones
        run: |
          python manage.py migrate

      - name: Ejecutar tests de integración
        run: |
          mkdir -p static
          python manage.py test app.test.test_integration --verbosity=2

      - name: Verificar configuración de deployment
        run: |
          python manage.py check --deploy

  e2e-test:
    runs-on: ubuntu-latest
    needs: integration-test

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear archivo .env para E2E
        run: |
          cat > .env << EOF
          SECRET_KEY=e2e-secret-key
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1
          DATABASE_NAME=e2e_test_db.sqlite3
          EOF

      - name: Ejecutar migraciones
        run: python manage.py migrate

      - name: Ejecutar test E2E
        run: |
          mkdir -p static
          python manage.py test app.test.test_e2e --verbosity=2

  notify-discord:
    runs-on: ubuntu-latest
    needs: e2e-test
    steps:
      - name: Enviar mensaje a discord
        run: | 
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"content\": \"Se completo el CI correctamente en la rama $GITHUB_REF por $GITHUB_ACTOR\"}" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
